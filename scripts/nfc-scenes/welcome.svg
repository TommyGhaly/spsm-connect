      <stop offset="0.45" stop-color="#992a21" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2b0d0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="welcome-arch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="0.5" stop-color="#b07a4a"/>
      <stop offset="1" stop-color="#5a3a22"/>
    </linearGradient>
    <radialGradient id="welcome-inside" cx="200" cy="185" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="0.35" stop-color="#ecd28f"/>
      <stop offset="0.8" stop-color="#b07a4a"/>
      <stop offset="1" stop-color="#8a5a34"/>
    </radialGradient>
    <linearGradient id="welcome-wallL" x1="0" y1="0" x2="1" y2="0">
