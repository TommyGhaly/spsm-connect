      <path d="M86 58 V295 M100 72 V291 M300 72 V291 M314 58 V295"/>
    </g>
    <!-- iron straps and studs -->
    <g stroke="#1a0807" stroke-width="3" fill="none">
      <path d="M64 120 L122 150 M64 246 L122 248"/>
      <path d="M336 120 L278 150 M336 246 L278 248"/>
    </g>
    <g fill="#d9b867">
      <circle cx="72" cy="124" r="1.6"/><circle cx="90" cy="133" r="1.6"/><circle cx="108" cy="143" r="1.6"/>
      <circle cx="72" cy="246" r="1.6"/><circle cx="90" cy="247" r="1.6"/><circle cx="108" cy="247.6" r="1.6"/>
      <circle cx="328" cy="124" r="1.6"/><circle cx="310" cy="133" r="1.6"/><circle cx="292" cy="143" r="1.6"/>
      <circle cx="328" cy="246" r="1.6"/><circle cx="310" cy="247" r="1.6"/><circle cx="292" cy="247.6" r="1.6"/>
    </g>
    <!-- light on the door edges -->
    <path d="M120 284 V130" stroke="#ecd28f" stroke-width="2.5" opacity="0.8"/>
    <path d="M280 284 V130" stroke="#ecd28f" stroke-width="2.5" opacity="0.8"/>
