  <path d="M0 284 H60 L40 400 H0 Z M400 284 H340 L360 400 H400 Z" fill="#1a0807" opacity="0.35"/>

  <radialGradient id="welcome-vig" cx="200" cy="200" r="205" gradientUnits="userSpaceOnUse">
    <stop offset="0.62" stop-color="#1a0807" stop-opacity="0"/>
    <stop offset="1" stop-color="#1a0807" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="400" height="400" fill="url(#welcome-vig)"/>
</svg>
