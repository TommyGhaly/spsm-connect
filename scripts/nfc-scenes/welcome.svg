<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="welcome-facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0d0d"/>
      <stop offset="0.7" stop-color="#3b1a12"/>
      <stop offset="1" stop-color="#2b120c"/>
