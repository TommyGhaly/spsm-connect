  </g>
  <g stroke="#6e1a14" stroke-width="0.8" fill="none" opacity="0.5">
    <path d="M0 41.5 H400 M0 83.5 H400 M0 125.5 H400 M0 167.5 H400 M0 209.5 H400 M0 251.5 H400"/>
  </g>
  <rect width="400" height="400" fill="url(#welcome-facadeGlow)"/>

  <!-- archivolt -->
  <path d="M96 290 V130 A104 104 0 0 1 304 130 V290 Z" fill="#2b120c"/>
  <path d="M102 290 V130 A98 98 0 0 1 298 130 V290 Z" fill="url(#welcome-arch)"/>
  <g stroke="#3b2316" stroke-width="1.2" opacity="0.8">
