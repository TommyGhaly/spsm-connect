    <path d="M44 300 H356 V312 H44 Z" fill="url(#welcome-riser)"/>
    <path d="M40 312 H360 V326 H40 Z" fill="url(#welcome-stepTop)"/>
    <path d="M24 326 H376 V340 H24 Z" fill="url(#welcome-riser)"/>
    <path d="M20 340 H380 V356 H20 Z" fill="url(#welcome-stepTop)"/>
    <path d="M0 356 H400 V372 H0 Z" fill="url(#welcome-riser)"/>
    <path d="M0 372 H400 V400 H0 Z" fill="url(#welcome-stepTop)"/>
    <g stroke="#b07a4a" stroke-width="1" opacity="0.55">
