    <rect x="355" y="140" width="10" height="22" fill="#ecd28f"/>
    <path d="M40 140 V162 M360 140 V162" stroke="#1a0807" stroke-width="1"/>
    <circle cx="40" cy="153" r="3" fill="#fff4d6"/>
    <circle cx="360" cy="153" r="3" fill="#fff4d6"/>
