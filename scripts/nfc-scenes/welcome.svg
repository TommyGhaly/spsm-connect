      <path d="M-5 1 Q-4 7 -1 10" fill="none" stroke="#f6e8e3" stroke-width="0.8" opacity="0.6"/>
      <ellipse cx="0" cy="0" rx="7.5" ry="1.6" fill="#d9b867"/>
      <path d="M0 0 C-1.6 -1.4 -1.6 -4 0 -7 C1.6 -4 1.6 -1.4 0 0 Z" fill="#fff4d6"/>
