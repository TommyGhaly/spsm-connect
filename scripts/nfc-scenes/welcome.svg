    <use xlink:href="#welcome-lamp" transform="translate(234 116) scale(0.85)"/>
    <use xlink:href="#welcome-lamp" transform="translate(146 92) scale(1.2)"/>
    <use xlink:href="#welcome-lamp" transform="translate(254 92) scale(1.2)"/>
