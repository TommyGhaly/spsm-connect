      <rect x="182" y="144.5" width="8" height="7"/><rect x="193" y="144.5" width="14" height="7"/>
      <rect x="210" y="144.5" width="8" height="7"/><rect x="221" y="144.5" width="8" height="7"/>
      <rect x="232" y="144.5" width="8" height="7"/>
